name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium --no-shell
      - run: npm run check
      - run: npm test
      - name: Real browser demo
        run: node bin/pagebend.js demo --profiles long-text,text-zoom,narrow --out ci-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagebend-demo-${{ matrix.os }}
          path: ci-demo/
          if-no-files-found: ignore
